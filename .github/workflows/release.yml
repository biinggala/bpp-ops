name: Publish Release

# Cutting a release has to be driven from the repository here: this environment's
# git proxy refuses tag pushes, and the GitHub tools available to the agent can
# only read releases. Editing CHANGELOG.md is therefore the release trigger — the
# version and notes are parsed from its top section, so the published release and
# the file in the repo cannot drift apart.
#
# The mac build lives here too rather than being delegated to desktop.yml: a
# release created with GITHUB_TOKEN does not trigger other workflows, so the
# binary has to be produced in the same run that publishes.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'CHANGELOG.md'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read version and notes from CHANGELOG.md
        id: notes
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re, pathlib

          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          sections = re.split(r"^## +", text, flags=re.M)[1:]
          if not sections:
              raise SystemExit("CHANGELOG.md has no '## <version>' section")

          head, _, body = sections[0].partition("\n")
          version = head.strip()
          if not re.fullmatch(r"v\d+\.\d+\.\d+", version):
              raise SystemExit(f"top section heading is not a version: {version!r}")

          # The desktop app compares its own version against the one the web
          # deployment publishes, and both come from package.json. If that has
          # not been bumped with the notes, the released app announces an update
          # to itself forever.
          import json
          pkg = json.loads(pathlib.Path("package.json").read_text(encoding="utf-8"))["version"]
          if pkg != version.lstrip("v"):
              raise SystemExit(
                  f"CHANGELOG says {version} but package.json says {pkg}. "
                  "Bump package.json, src-tauri/tauri.conf.json and src-tauri/Cargo.toml together."
              )

          # An app built against a placeholder key accepts no update at all, and
          # would say so only months later when one was finally offered.
          conf = json.loads(pathlib.Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))
          pubkey = conf.get("plugins", {}).get("updater", {}).get("pubkey", "")
          if not pubkey or "PLACEHOLDER" in pubkey:
              raise SystemExit(
                  "src-tauri/tauri.conf.json has no updater public key. "
                  "Generate a key pair, put the public half here and the private half "
                  "in the TAURI_SIGNING_PRIVATE_KEY secret — see docs/desktop-updates.md."
              )

          print(f"version={version}")
          delim = "EOF_NOTES"
          print(f"body<<{delim}")
          print(body.strip())
          print(delim)
          PY

      # The updater bundle is signed at the end of a seven-minute mac build. A
      # missing secret should not cost that long to discover.
      - name: Check the signing key is available
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          [ -n "$KEY" ] || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set — see docs/desktop-updates.md"; exit 1; }
          # An absent password is legitimate: a key generated without one signs
          # with the variable empty. Only a *wrong* password fails, and that it
          # cannot know until it signs.
          [ -n "$PASSWORD" ] || echo "::warning::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is empty — fine if the key has no password, otherwise signing will fail"

          # The key is base64 that a person copied out of a terminal once, and a
          # copy that drops the trailing '=' is indistinguishable from a good one
          # until the very end of a seven-minute build, where it reads as
          # "Invalid padding". Whitespace out, padding back, masked before it is
          # ever a variable — the repaired string is not the secret GitHub knows
          # to hide.
          FIXED=$(printf '%s' "$KEY" | tr -d '[:space:]')
          while [ $(( ${#FIXED} % 4 )) -ne 0 ]; do FIXED="${FIXED}="; done
          echo "::add-mask::$FIXED"
          echo "SIGNING_KEY=$FIXED" >> "$GITHUB_ENV"
          if [ "$FIXED" != "$KEY" ]; then
            echo "::warning::the signing key needed repadding — the secret is very likely a truncated copy"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build universal .app and .dmg
        env:
          CRNG_OAUTH_CLIENT_ID: ${{ secrets.CRNG_OAUTH_CLIENT_ID }}
          CRNG_OAUTH_CLIENT_SECRET: ${{ secrets.CRNG_OAUTH_CLIENT_SECRET }}
          # Signs the updater bundle. Without these the build still produces a
          # .dmg, but no .tar.gz.sig, and the step below fails rather than
          # publishing an update nobody's app would accept.
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target universal-apple-darwin

      # ── The update the running app will find ──────────────────────────────
      #
      # The .dmg attached to the release is behind the repository's own login,
      # which a private repo requires and an app cannot pass. The updater bundle
      # therefore ships with the web deployment, which is public: committed to
      # public/, published by the deploy workflow, and served from the same
      # origin the app already loads itself from.
      #
      # It is a binary in git, about 9MB a release. That is the price of not
      # standing up a second host for one file.
      - name: Publish the updater bundle
        env:
          VERSION: ${{ steps.notes.outputs.version }}
        run: |
          set -euo pipefail
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle/macos
          TARBALL="$BUNDLE/bpp-ops.app.tar.gz"
          test -f "$TARBALL"     || { echo "::error::no updater bundle — is TAURI_SIGNING_PRIVATE_KEY set?"; exit 1; }
          test -f "$TARBALL.sig" || { echo "::error::the updater bundle is unsigned"; exit 1; }

          mkdir -p public/updates
          cp "$TARBALL" public/updates/bpp-ops.app.tar.gz

          python3 - <<'PY'
          import json, os, datetime, pathlib

          version = os.environ["VERSION"].lstrip("v")
          sig = pathlib.Path(
              "src-tauri/target/universal-apple-darwin/release/bundle/macos/bpp-ops.app.tar.gz.sig"
          ).read_text().strip()
          url = "https://crng-task-manager.web.app/updates/bpp-ops.app.tar.gz"

          # One universal build, listed under every key the client might ask for:
          # which of the three it looks up depends on how it was built, and being
          # wrong there reads as "no update available" rather than as an error.
          entry = {"signature": sig, "url": url}
          pathlib.Path("public/updates/latest.json").write_text(json.dumps({
              "version": version,
              "notes": f"bpp-ops {version}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z"),
              "platforms": {
                  "darwin-universal": entry,
                  "darwin-aarch64": entry,
                  "darwin-x86_64": entry,
              },
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add public/updates
          git commit -m "chore(release): publish the $VERSION updater bundle"
          # Main may have moved while the mac build ran.
          git pull --rebase origin main
          git push origin HEAD:main

      # The commit above lands on main but publishes nothing: a push made with
      # GITHUB_TOKEN does not start another workflow, so the deploy that would
      # normally carry it never runs and the endpoint stays a 404. This job puts
      # the bundle live itself. Committing still matters — it is what keeps the
      # files there when the *next* ordinary deploy replaces the whole site.
      - name: Put the updater bundle live
        run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: crng-task-manager

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.version }}
          name: ${{ steps.notes.outputs.version }} — bpp-ops
          target_commitish: ${{ github.sha }}
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          body: |
            ${{ steps.notes.outputs.body }}

            ---

            **macOS 데스크톱 앱** (Intel + Apple Silicon 유니버설)

            서명되지 않은 빌드라 첫 실행 시 macOS가 막습니다:
            1. `.dmg`를 열고 앱을 `응용 프로그램`으로 드래그
            2. 터미널에서 `xattr -cr "/Applications/bpp-ops.app"` 실행
            3. 앱 실행

  # ── Windows ─────────────────────────────────────────────────────────────────
  #
  # A job of its own rather than a matrix leg, and deliberately downstream of the
  # mac one. The release, the updater manifest and the deploy are all created up
  # there; this appends to them. A matrix would put two runners in a race to
  # create the same release and to push the same manifest.
  #
  # The shell is the whole of the Windows work — there is no Windows frontend to
  # write, because this window loads the same deployed web app the mac one does.
  windows:
    needs: release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      # main has moved: the mac job pushed the updater manifest to it.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Read the version from CHANGELOG.md
        id: notes
        run: |
          VERSION=$(python -c "import re,pathlib; print(re.split(r'^## +', pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8'), flags=re.M)[1].splitlines()[0].strip())")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Repad the signing key
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          FIXED=$(printf '%s' "$KEY" | tr -d '[:space:]')
          while [ $(( ${#FIXED} % 4 )) -ne 0 ]; do FIXED="${FIXED}="; done
          echo "::add-mask::$FIXED"
          echo "SIGNING_KEY=$FIXED" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # NSIS rather than MSI: it is the one that produces an updater artifact,
      # and one .exe is what a person can be handed.
      - name: Build the installer
        env:
          CRNG_OAUTH_CLIENT_ID: ${{ secrets.CRNG_OAUTH_CLIENT_ID }}
          CRNG_OAUTH_CLIENT_SECRET: ${{ secrets.CRNG_OAUTH_CLIENT_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis

      # The banner that offers an update reads latest.json's top-level version,
      # which the mac job already wrote — so a Windows app would be told an
      # update exists and then find no bundle for its own platform. This entry is
      # what keeps that promise honest.
      - name: Publish the Windows updater bundle
        env:
          VERSION: ${{ steps.notes.outputs.version }}
        run: |
          set -euo pipefail
          NSIS=src-tauri/target/release/bundle/nsis
          ZIP=$(ls "$NSIS"/*-setup.nsis.zip)
          test -f "$ZIP.sig" || { echo "::error::the Windows updater bundle is unsigned"; exit 1; }

          mkdir -p public/updates
          cp "$ZIP" public/updates/bpp-ops-setup.nsis.zip

          SIG=$(cat "$ZIP.sig") python - <<'PY'
          import json, os, pathlib

          manifest = pathlib.Path("public/updates/latest.json")
          data = json.loads(manifest.read_text(encoding="utf-8"))
          data["platforms"]["windows-x86_64"] = {
              "signature": os.environ["SIG"].strip(),
              "url": "https://crng-task-manager.web.app/updates/bpp-ops-setup.nsis.zip",
          }
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add public/updates
          git commit -m "chore(release): publish the $VERSION Windows updater bundle"
          git pull --rebase origin main
          git push origin HEAD:main

      # Same reason as the mac job: a push made with GITHUB_TOKEN starts no
      # workflow, so this deploys the file it just committed itself.
      - name: Put the bundle live
        run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: crng-task-manager

      # Appended rather than written: the note should exist only if the build
      # that backs it did.
      - name: Attach the installer to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.version }}
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
          append_body: true
          body: |

            **Windows 데스크톱 앱** (64비트)

            `-setup.exe`를 실행하세요. 서명되지 않은 빌드라 처음에 SmartScreen이 막습니다:
            **추가 정보 → 실행**을 누르면 설치됩니다.
